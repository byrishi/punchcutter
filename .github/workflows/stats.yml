# Records GitHub interest and download numbers in PostHog once a day.
# Optional: add a fine-grained token with "Administration: read" on this repo as the
# TRAFFIC_TOKEN secret to also record views, clones and referrers.
name: stats
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/github_stats.py
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
